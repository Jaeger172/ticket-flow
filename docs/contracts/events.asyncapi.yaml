asyncapi: 2.6.0
id: urn:ticket-flow:orders
info:
  title: Ticket Flow — доменные события
  version: 1.0.0
  description: 'Точка зрения приложения Orders: subscribe получает факты Reservations / Payments, publish отправляет
    факты Orders. x-producer указывает фактического издателя. HTTP-команды описаны OpenAPI. Доставка at least once;
    повтор сохраняет messageId.'
  contact:
    name: Ticket Flow project
    url: https://github.com/Jaeger172/ticket-flow
defaultContentType: application/json
servers:
  local:
    url: rabbitmq:5672
    protocol: amqp
    protocolVersion: 0-9-1
    description: Внутренняя сеть Compose; durable topic exchange ticket-flow.events.
    security:
    - brokerCredentials: []
channels:
  reservation.held.v1:
    description: Reservations публикует ReservationHeld. Направление операции указано с позиции Orders.
    x-producer: Reservations
    x-consumer: Orders
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: ticket-flow.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    subscribe:
      operationId: receiveReservationHeld
      message:
        $ref: '#/components/messages/ReservationHeld'
  reservation.confirmed.v1:
    description: Reservations публикует ReservationConfirmed. Направление операции указано с позиции Orders.
    x-producer: Reservations
    x-consumer: Orders
    bindings:
      amqp:
