    subscribe:
      operationId: receivePaymentRefunded
      message:
        $ref: '#/components/messages/PaymentRefunded'
  order.confirmed.v1:
    description: Orders публикует OrderConfirmed. Направление операции указано с позиции Orders.
    x-producer: Orders
    x-consumer: Необязательные будущие подписчики
