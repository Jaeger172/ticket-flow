    bindings:
      amqp:
        is: routingKey
        exchange:
          name: ticket-flow.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    subscribe:
      operationId: receiveReservationReleased
      message:
        $ref: '#/components/messages/ReservationReleased'
  reservation.expired.v1:
    description: Reservations публикует ReservationExpired. Направление операции указано с позиции Orders.
    x-producer: Reservations
    x-consumer: Orders
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: ticket-flow.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    subscribe:
      operationId: receiveReservationExpired
      message:
        $ref: '#/components/messages/ReservationExpired'
  payment.succeeded.v1:
    description: Payments публикует PaymentSucceeded. Направление операции указано с позиции Orders.
    x-producer: Payments
    x-consumer: Orders
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: ticket-flow.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
    subscribe:
