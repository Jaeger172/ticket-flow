            format: uuid
          causationId:
            type: string
            minLength: 1
          aggregateId:
            type: string
            format: uuid
          aggregateVersion:
            type: integer
            minimum: 1
          data:
            type: object
            additionalProperties: false
            required:
            - reservationId
            - orderId
            - eventId
            - seatId
            - amountMinor
            - currency
            - expiresAt
            properties:
